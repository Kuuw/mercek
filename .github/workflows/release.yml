name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Artifacts
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          ARCHIVE_NAME="mercek-${TAG}-${{ matrix.target }}"
          mkdir "$ARCHIVE_NAME"
          
          # Copy binary
          cp "target/${{ matrix.target }}/release/mercek" "$ARCHIVE_NAME/"
          
          # Copy documentation and licenses
          cp README.md LICENSE "$ARCHIVE_NAME/" 2>/dev/null || true
          cp resources/font/SNPro/OFL.txt "$ARCHIVE_NAME/LICENSE-SNPro-OFL.txt"
          
          # Create compressed archive and checksum
          tar -czvf "${ARCHIVE_NAME}.tar.gz" "$ARCHIVE_NAME"
          sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mercek-*.tar.gz
            mercek-*.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}